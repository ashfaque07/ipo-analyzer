[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These values are public provider configuration and intentionally appear in
  # the server source as defaults. Keep secret scanning enabled for AI_API_KEY.
  SECRETS_SCAN_OMIT_KEYS = "AI_BASE_URL,AI_MODEL"

[functions]
  node_bundler = "esbuild"

# Route API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
