[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These keys are non-secret config values (defaults also live in source),
  # so exclude them from Netlify's secrets scanner to avoid false positives.
  SECRETS_SCAN_OMIT_KEYS = "PORT,AI_MODEL,AI_MODELS,AI_BASE_URL"

[functions]
  node_bundler = "esbuild"

# Route API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
